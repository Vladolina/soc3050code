[project]
name = "soc3050code"
version = "2026.11"
description = "SOC3050 Embedded Systems - the PC side: the station, the lessons' host scripts, the build helpers"
readme = "README.md"
requires-python = ">=3.12"

# What the current course runs.  After cloning:   uv sync
dependencies = [
    "pyserial>=3.5",      # tools/station, ARM 08 host.py, 14 host/mission.py, 16 host/planner.py
    "matplotlib>=3.8",    # ARM 08 host.py --chart
    "capstone>=5.0",      # projects2026_arm/_build/disasm.py
]

[dependency-groups]
# The station's --snapshot (screenshots for the docs).        uv sync --group docs
docs = ["pillow>=10"]
# The previous edition's python_projects/, python_libs/ and dashboards/.
#                                                              uv sync --group legacy
legacy = [
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "scipy>=1.10.0",
    "intelhex>=2.3.0",
    "jupyterlab>=3.6.0",
]

[tool.uv]
# A course, not a library: uv sync makes the environment and installs nothing
# of its own.  uv's own Python builds include tkinter, which the station needs.
package = false
